# Static site. The data lives on the n8n server (see n8n/).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The netlify.app address always exists; send everyone to the real domain.
[[redirects]]
  from = "https://gwrealty.netlify.app/*"
  to = "https://inventory.gwrealtyglobal.com/:splat"
  status = 301
  force = true

# MAINTENANCE: every page shows maintenance.html. Remove this block to bring the app back.
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 200
  force = true
