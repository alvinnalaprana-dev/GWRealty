<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>GW Realty Inventory – Maintenance</title>
<style>
:root{--red:#A61011}*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,Arial,sans-serif;background:#F5F5F5;color:#222;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--red);padding:14px 16px;display:flex;justify-content:center}header img{height:34px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border:1px solid #E2E4E4;border-radius:10px;padding:32px 28px;max-width:440px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{font-size:22px;margin:0 0 10px}p{color:#555;line-height:1.5;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;margin-bottom:14px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
</style></head><body>
<header><b style="color:#fff;letter-spacing:.18em;font-size:14px">GW REALTY · INVENTORY</b></header>
<main><div class="card"><span class="dot"></span><h1>Under maintenance</h1><p>The inventory app is being updated and will be back shortly. Please try again in a few minutes.</p></div></main>
</body></html>
